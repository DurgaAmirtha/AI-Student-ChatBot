<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Super Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        brandAccent: '#3b82f6',
                        brandHover: '#2563eb'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-darkBg text-white min-h-screen flex items-center justify-center overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="relative z-10 w-full max-w-md p-8 glass-panel rounded-2xl shadow-2xl mx-4">
        <div class="text-center mb-8">
            <i class="fa-solid fa-graduation-cap text-4xl text-blue-500 mb-4"></i>
            <h1 class="text-3xl font-bold mb-2">Student <span class="gradient-text">AI</span></h1>
            <p class="text-gray-400 text-sm">Your personal mentor, tutor, and planner.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white placeholder-gray-500" placeholder="student@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-brandAccent hover:bg-brandHover text-white font-medium py-2.5 rounded-lg transition duration-200 transform hover:scale-[1.02]">
                Sign In
            </button>
            <p class="text-center text-sm text-gray-400 mt-4">
                Don't have an account? <a href="#" id="showSignup" class="text-blue-400 hover:text-blue-300">Create one</a>
            </p>
        </form>

        <!-- Signup Form (Hidden by default) -->
        <form id="signupForm" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                <input type="text" id="signupName" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="signupEmail" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="signupPassword" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Course (Optional)</label>
                <input type="text" id="signupCourse" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white" placeholder="e.g. B.Tech Computer Science">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-blue-500 hover:from-purple-600 hover:to-blue-600 text-white font-medium py-2.5 rounded-lg transition duration-200 transform hover:scale-[1.02]">
                Get Started
            </button>
            <p class="text-center text-sm text-gray-400 mt-4">
                Already have an account? <a href="#" id="showLogin" class="text-blue-400 hover:text-blue-300">Sign In</a>
            </p>
        </form>

        <div id="authError" class="mt-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 rounded-lg text-sm text-center hidden">
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
